name: Build TKA MathGuard APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Build APK
    run: gradle --no-daemon --stacktrace :app:assembleDebug

  - name: Find APK
    run: |
      find app/build/outputs -type f -name "*.apk" -print
      test -n "$(find app/build/outputs -type f -name "*.apk" -print -quit)"

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: TKA-MathGuard-APK
      path: app/build/outputs/**/*.apk
      if-no-files-found: error
```
