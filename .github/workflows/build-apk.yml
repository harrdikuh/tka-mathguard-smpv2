name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Inspect manifest
        run: |
          echo "=== FIRST 100 BYTES ==="
          python3 -c "print(repr(open('app/src/main/AndroidManifest.xml','rb').read(100)))"
          echo "=== FILE CONTENT ==="
          cat -n app/src/main/AndroidManifest.xml

      - name: Validate manifest
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/AndroidManifest.xml'); print('XML VALID')"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TKA-MathGuard-SMP
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
```
